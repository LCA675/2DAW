<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogo</title>
</head>
<body>
<h1>Catalogo</h1>
<!--Mostramos en una lista ordenada los materiales que hay -->
<ol>
    <li th:each="material : ${lista}">
        <p th:text="${material[1]}"></p>
        <a th:href="@{materiales/{codigo}(codigo=${material[0]})}">Ver material</a>
    </li>
</ol>

</body>
</html>
