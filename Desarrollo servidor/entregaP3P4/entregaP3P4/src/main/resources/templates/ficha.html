<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ficha material</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 16px;
        color: #222;
    }

    h1 {
        color: #1e5aa8;
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        padding: 6px 0;
        border-bottom: 1px solid #eee;
    }

    a {
        color: #1e5aa8;
    }

</style>
<body>
<h1 th:text="${nombre}"></h1>

<ul>
    <li th:text="${codigo}"></li>
    <li th:text="${descripcion}"></li>
    <li th:text="${turno}"></li>
</ul>

<a th:href="@{/solicitud/nueva}">Solicitud nueva</a>

</body>
</html>
