<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{inicio.titulo}">Inicio</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body>
<!--el replace cambia esta etiqueta por la que tenemos en el fragmento-->
<header th:replace="~{fragmentos :: cabecera('inicio.titulo')}"></header>
<!--Menu -->
<nav th:replace="~{fragmentos :: navegacion(${ruta})}"></nav>

<main class="lista">
<!--    Repite la tarjeta por cada actividad que tengamos-->
    <th:block th:each="id : ${actividades}">
        <article th:replace="~{fragmentos :: tarjeta(
                |centro.${id}.nombre|,
                |centro.${id}.descripcion|,
                |centro.${id}.fecha|,
                |centro.${id}.lugar|,
                |centro.${id}.duracion|)}"></article>
    </th:block>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
