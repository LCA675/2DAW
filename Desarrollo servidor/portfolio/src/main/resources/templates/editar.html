<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragmentos :: cabecera(#{editar.titulo.pagina})}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>

<main>
    <h1 th:text="#{editar.titulo.pagina}">Editar portfolio</h1>

    <!-- Formulario enlazado con PortfolioForm; la validación la hace el servidor -->
    <form th:action="@{/portfolio/editar}" th:object="${form}" method="post" novalidate>

        <!-- Botón oculto para que al pulsar Enter se genere la vista previa -->
        <button type="submit" name="accion" value="preview" class="oculto"
                tabindex="-1" aria-hidden="true">preview</button>

        <p th:if="${!errores.isEmpty()}" class="aviso" th:text="#{editar.revisa}">Revisa los campos indicados</p>

        <!-- Datos personales -->
        <section>
            <h2 th:text="#{editar.datospersonales}">Datos personales</h2>

            <div class="campo">
                <label for="nombre" th:text="#{editar.nombre} + ' *'">Nombre completo *</label>
                <input type="text" th:field="*{nombre}">
                <span th:replace="~{fragmentos :: error('nombre')}"></span>
            </div>

            <div class="campo">
                <label for="titular" th:text="#{editar.titular} + ' *'">Titular *</label>
                <input type="text" th:field="*{titular}">
                <span th:replace="~{fragmentos :: error('titular')}"></span>
            </div>

            <div class="campo">
                <label for="presentacion" th:text="#{editar.presentacion} + ' *'">Presentación *</label>
                <textarea rows="3" th:field="*{presentacion}"></textarea>
                <span th:replace="~{fragmentos :: error('presentacion')}"></span>
            </div>

            <div class="campo">
                <label for="ciudad" th:text="#{editar.ciudad}">Ciudad</label>
                <input type="text" th:field="*{ciudad}">
            </div>

            <div class="campo">
                <label for="correo" th:text="#{editar.correo}">Correo</label>
                <input type="email" th:field="*{correo}">
                <span th:replace="~{fragmentos :: error('correo')}"></span>
            </div>
        </section>

        <!-- Proyectos -->
        <section>
            <h2 th:text="#{editar.proyectos}">Proyectos</h2>
            <p th:text="#{editar.contador(${#lists.size(form.proyectos)}, ${max})}">Proyectos: 1 de 5</p>
            <span th:replace="~{fragmentos :: error('proyectos')}"></span>

            <!-- Una fila por proyecto; __${fila.index}__ pone el número de fila: proyectos[0].titulo... -->
            <div class="fila-proyecto" th:each="proyecto, fila : *{proyectos}">
                <h3 th:text="${fila.count}">1</h3>

                <div class="campo">
                    <label th:for="|proyectos${fila.index}.titulo|"
                           th:text="#{editar.proyecto.titulo} + ' *'">Título *</label>
                    <input type="text" th:field="*{proyectos[__${fila.index}__].titulo}">
                    <span th:replace="~{fragmentos :: error('proyectos[__${fila.index}__].titulo')}"></span>
                </div>

                <div class="campo">
                    <label th:for="|proyectos${fila.index}.anio|"
                           th:text="#{editar.proyecto.anio} + ' *'">Año *</label>
                    <input type="text" inputmode="numeric" th:field="*{proyectos[__${fila.index}__].anio}">
                    <span th:replace="~{fragmentos :: error('proyectos[__${fila.index}__].anio')}"></span>
                </div>

                <div class="campo">
                    <label th:for="|proyectos${fila.index}.categoria|"
                           th:text="#{editar.proyecto.categoria} + ' *'">Categoría *</label>
                    <select th:field="*{proyectos[__${fila.index}__].categoria}">
                        <option value="" th:text="#{editar.seleccionar}">-- Selecciona --</option>
                        <option value="Aplicaciones" th:text="#{categoria.aplicaciones}">Aplicaciones</option>
                        <option value="Sitios web" th:text="#{categoria.sitiosweb}">Sitios web</option>
                        <option value="Diseño" th:text="#{categoria.diseno}">Diseño</option>
                    </select>
                    <span th:replace="~{fragmentos :: error('proyectos[__${fila.index}__].categoria')}"></span>
                </div>

                <div class="campo">
                    <label th:for="|proyectos${fila.index}.estado|"
                           th:text="#{editar.proyecto.estado} + ' *'">Estado *</label>
                    <select th:field="*{proyectos[__${fila.index}__].estado}">
                        <option value="" th:text="#{editar.seleccionar}">-- Selecciona --</option>
                        <option value="En curso" th:text="#{estado.encurso}">En curso</option>
                        <option value="Terminado" th:text="#{estado.terminado}">Terminado</option>
                    </select>
                    <span th:replace="~{fragmentos :: error('proyectos[__${fila.index}__].estado')}"></span>
                </div>

                <div class="campo">
                    <label th:for="|proyectos${fila.index}.descripcion|"
                           th:text="#{editar.proyecto.descripcion} + ' *'">Descripción *</label>
                    <textarea rows="2" th:field="*{proyectos[__${fila.index}__].descripcion}"></textarea>
                    <span th:replace="~{fragmentos :: error('proyectos[__${fila.index}__].descripcion')}"></span>
                </div>

                <!-- Quita esta fila (envía quitar-0, quitar-1...) -->
                <button type="submit" name="accion" th:value="|quitar-${fila.index}|"
                        th:text="#{editar.quitar}">Quitar este proyecto</button>
            </div>

            <!-- Botón de añadir o aviso si se ha llegado al máximo -->
            <button type="submit" name="accion" value="anadir"
                    th:if="${#lists.size(form.proyectos) < max}"
                    th:text="#{editar.anadir}">Añadir proyecto</button>
            <p th:unless="${#lists.size(form.proyectos) < max}" class="aviso"
               th:text="#{editar.limite}">Has alcanzado el límite de proyectos</p>
        </section>

        <button type="submit" name="accion" value="preview"
                th:text="#{editar.generar}">Generar vista previa</button>
    </form>
</main>

<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
