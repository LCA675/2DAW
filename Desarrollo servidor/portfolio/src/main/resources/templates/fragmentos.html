<!DOCTYPE html>
<!-- Este archivo no se muestra solo: guarda trozos que reutilizan las demás plantillas -->
<html xmlns:th="http://www.thymeleaf.org">

<!-- ===== Fragmento 1: <head> común. Recibe el título de la pestaña como parámetro ===== -->
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Título</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>

<body>

<!-- ===== Fragmento 2: menú de navegación y cambio de idioma ===== -->
<header th:fragment="menu" class="menu">
    <nav>
        <a th:href="@{/curriculum}" th:text="#{menu.curriculum}">Currículum</a>
        <a th:href="@{/portfolio}" th:text="#{menu.portfolio}">Portfolio</a>
        <a th:href="@{/portfolio/editar}" th:text="#{menu.editar}">Editar portfolio</a>
    </nav>
    <!-- '' = misma página actual; solo se añade ?lang=... -->
    <div class="idiomas">
        <a th:href="@{''(lang=es)}" th:text="#{idioma.es}">Español</a>
        <a th:href="@{''(lang=en)}" th:text="#{idioma.en}">English</a>
    </div>
</header>

<!-- ===== Fragmento 3: etiqueta de estado de un proyecto (verde o gris) ===== -->
<!-- Se compara con el valor guardado en Java, y se muestra el texto traducido -->
<span th:fragment="estado(valor)" th:switch="${valor}">
    <span th:case="'En curso'" class="etiqueta estado-encurso" th:text="#{estado.encurso}">En curso</span>
    <span th:case="'Terminado'" class="etiqueta estado-terminado" th:text="#{estado.terminado}">Terminado</span>
</span>

<!-- ===== Fragmento 4: pie de página ===== -->
<footer th:fragment="pie" class="pie">
    <p>© 2026 Laura Calle Anguita</p>
</footer>

</body>
</html>
