<!DOCTYPE html>
<!-- Trozos que se reutilizan en las demás páginas -->
<html xmlns:th="http://www.thymeleaf.org">

<!-- Head común, recibe el título de la pestaña -->
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Título</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>

<body>

<!-- Menú y cambio de idioma -->
<header th:fragment="menu" class="menu">
    <nav>
        <a th:href="@{/curriculum}" th:text="#{menu.curriculum}">Currículum</a>
        <a th:href="@{/portfolio}" th:text="#{menu.portfolio}">Portfolio</a>
        <a th:href="@{/portfolio/editar}" th:text="#{menu.editar}">Editar portfolio</a>
    </nav>
    <!-- Recarga la misma página añadiendo ?lang= -->
    <div class="idiomas">
        <a th:href="@{''(lang=es)}" th:text="#{idioma.es}">Español</a>
        <a th:href="@{''(lang=en)}" th:text="#{idioma.en}">English</a>
    </div>
</header>

<!-- Nombre con su nivel traducido, por ejemplo "Inglés — nivel medio" -->
<span th:fragment="nivel(nombre, nivel)" class="etiqueta" th:classappend="|nivel-${nivel}|"
      th:with="n=#{${'nivel.' + nivel}}"
      th:text="#{nivel.texto(${nombre}, ${n})}">Nombre — nivel medio</span>

<!-- Estado del proyecto traducido (verde en curso, gris terminado) -->
<span th:fragment="estado(valor)" th:switch="${valor}">
    <span th:case="'En curso'" class="etiqueta estado-encurso" th:text="#{estado.encurso}">En curso</span>
    <span th:case="'Terminado'" class="etiqueta estado-terminado" th:text="#{estado.terminado}">Terminado</span>
</span>

<!-- Categoría del proyecto traducida -->
<span th:fragment="categoria(valor)" th:switch="${valor}">
    <span th:case="'Aplicaciones'" th:text="#{categoria.aplicaciones}">Aplicaciones</span>
    <span th:case="'Sitios web'" th:text="#{categoria.sitiosweb}">Sitios web</span>
    <span th:case="'Diseño'" th:text="#{categoria.diseno}">Diseño</span>
    <span th:case="*" th:text="${valor}">Otra</span>
</span>

<!-- Mensaje de error de un campo del formulario, solo si tiene error -->
<span th:fragment="error(campo)" class="error"
      th:if="${errores.containsKey(campo)}"
      th:text="#{${errores.get(campo)}}">Error</span>

<!-- Pie de página -->
<footer th:fragment="pie" class="pie">
    <p>© 2026 Laura Calle Anguita</p>
</footer>

</body>
</html>
