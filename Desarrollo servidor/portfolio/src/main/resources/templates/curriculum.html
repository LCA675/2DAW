<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragmentos :: cabecera(#{cv.titulo.pagina})}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>

<main>
    <!-- Perfil -->
    <section>
        <h2 th:text="#{cv.perfil}">Perfil</h2>
        <h1 th:text="${nombre}">Nombre</h1>
        <p><strong th:text="${titular}">Titular</strong></p>
        <p th:text="${presentacion}">Presentación</p>
    </section>

    <!-- Contacto, solo si hay correo -->
    <section th:if="${!#strings.isEmpty(correo)}">
        <h2 th:text="#{cv.contacto}">Contacto</h2>
        <a th:href="|mailto:${correo}|" th:text="${correo}">correo@ejemplo.com</a>
    </section>

    <!-- Formación -->
    <section>
        <h2 th:text="#{cv.formacion}">Formación</h2>
        <ul>
            <li th:each="estudio : ${estudios}">
                <strong th:text="${estudio.titulo}">Título</strong> —
                <span th:text="${estudio.centro}">Centro</span>
                (<span th:text="${estudio.anio_comienzo}">2023</span> –
                <!-- Si sigue en curso pone "En curso" en vez del año final -->
                <span th:text="${estudio.enCurso} ? #{cv.encurso} : ${estudio.anio_final}">2025</span>)
            </li>
        </ul>
    </section>

    <!-- Experiencia, con un mensaje si no hay ninguna -->
    <section>
        <h2 th:text="#{cv.experiencia}">Experiencia</h2>
        <p th:if="${#arrays.isEmpty(experiencias)}" th:text="#{cv.experiencia.vacia}">
            En busca de mi primera experiencia
        </p>
        <ul th:unless="${#arrays.isEmpty(experiencias)}">
            <li th:each="exp : ${experiencias}">
                <strong th:text="${exp.puesto}">Puesto</strong> —
                <span th:text="${exp.empresa}">Empresa</span>
                (<span th:text="${exp.anio_comienzo}">Inicio</span> –
                <span th:text="${exp.anio_final}">Fin</span>)
            </li>
        </ul>
    </section>

    <!-- Habilidades -->
    <section>
        <h2 th:text="#{cv.habilidades}">Habilidades</h2>
        <ul>
            <li th:each="habilidad : ${habilidades}">
                <div th:replace="~{fragmentos :: nivel(${habilidad.nombre}, ${habilidad.nivel})}"></div>
                <p th:text="${habilidad.descripcion}">Descripción</p>
            </li>
        </ul>
    </section>

    <!-- Idiomas -->
    <section>
        <h2 th:text="#{cv.idiomas}">Idiomas</h2>
        <ul>
            <li th:each="idioma : ${idiomas}">
                <span th:replace="~{fragmentos :: nivel(${idioma.nombre}, ${idioma.nivel})}"></span>
            </li>
        </ul>
    </section>

    <!-- Aviso para imprimir, no sale en el PDF -->
    <p class="no-imprimir">
        <strong th:text="#{cv.imprimir}">Imprimir o guardar como PDF</strong>: Ctrl + P
    </p>
</main>

<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
