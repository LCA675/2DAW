<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11130f">
    <title>Recinto Real de la Feria de Sevilla</title>
    <link rel="stylesheet" th:href="@{/css/recinto.css}">
</head>
<body>

<div class="site-shell">
    <header class="topbar">
        <a class="brand" th:href="@{/}" aria-label="Listado de las casetas">
            <span class="brand-mark" aria-hidden="true">C!</span>
            <span>LISTADO<span class="brand-sub">FERIA DE SEVILLA</span></span>
        </a>
        <div class="connection-status">
            <span class="status-light" aria-hidden="true"></span>
            <span>LISTADO DE LAS CASETAS</span>
        </div>
    </header>

    <main>
        <div class="notice success" role="status" th:if="${mensajeExito}" th:text="${mensajeExito}">
            Caseta añadida al recinto.
        </div>

        <!-- Estado vacío: se muestra solo si todavía no hay casetas registradas -->
        <p class="empty-state" th:if="${#lists.isEmpty(casetas)}">
            Todavía no hay casetas en el recinto.
        </p>

        <article class="game-card" th:each="caseta, iteracion : ${casetas}">
            <div class="game-art" th:classappend="${'art-variant-' + (iteracion.index % 5)}">
                <span class="art-index" th:text="${#numbers.formatInteger(iteracion.index + 1, 2)}">01</span>
                <span class="art-console" th:text="${caseta.calle + ', ' + caseta.numeroCalle}">Calle, 1</span>
                <span class="art-initial" th:text="${#strings.substring(caseta.nombre, 0, 1)}">C</span>
            </div>

            <div class="game-info">
                <div class="game-title-line">
                    <h3 th:text="${caseta.nombre}">Nombre de la caseta</h3>
                    <span class="game-price"
                          th:text="${#numbers.formatDecimal(caseta.metrosCuadrados, 1, 'POINT', 2, 'COMMA')} + ' m²'">0,00 m²</span>
                </div>

                <div class="game-meta">
                    <span th:text="${caseta.calle}">Calle</span>
                    <span class="meta-dot" aria-hidden="true">·</span>
                    <span th:text="${'Nº ' + caseta.numeroCalle}">Nº 1</span>
                    <span class="meta-dot" aria-hidden="true">·</span>
                    <span th:text="${caseta.publica} ? 'Pública' : 'Privada'">Pública</span>
                    <span class="meta-dot" aria-hidden="true">·</span>
                    <span th:text="${'Alta: ' + #temporals.format(caseta.fechaAlta, 'dd/MM/yyyy')}">Alta: 01/01/2026</span>
                </div>

                <!-- Descripción y foto son opcionales: solo se pintan si tienen contenido -->
                <p class="game-description"
                   th:if="${!#strings.isEmpty(caseta.descripcion)}"
                   th:text="${caseta.descripcion}">Descripción</p>

                <img class="game-photo"
                     th:if="${!#strings.isEmpty(caseta.foto)}"
                     th:src="${caseta.foto}"
                     th:alt="${'Foto de ' + caseta.nombre}">

                <div class="stock-line">
                    <span class="stock-label">NÚMERO DE SOCIOS</span>
                    <span class="stock-value" th:text="${caseta.numSocios}">0</span>
                </div>
            </div>
        </article>

        <!-- Aquí irá el formulario de alta -->

    </main>
</div>

</body>
</html>
