<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>

<body>
     <button onclick="suma()">Calcular </button>
        <input type="number" id="num1">
        <label for="">+</label>
        <input type="number" id="num2">
        <label for="">=</label>
        <input type="number" id="resul">

        <br><br>


</body>
<script>
    function suma() {
        let resul = 0;
        //Sacamos el num1 y el num2 a traves de la ID para saber que numeros sumar
        let num1 = document.getElementById("num1").value;
        let num2 = document.getElementById("num2").value;
        //Sumamos los numeros y lo almacenamos en resul
        resul = parseInt(num1) + parseInt(num2);


        //hacemos un innerHTML donde meteremos el codigo donde crearemos la tabla
        document.body.innerHTML += `
        <table border="1">
            <tr>
                <th>Numero 1</th>
                <th>    </th>
                <th>Numero 2</th>
                <th>    </th>
                <th>Resultado</th>
            </tr>
            <tr>
                <td>${num1}</td>
                <td>   +   </td>
                <td>${num2}</td>
                <td>   =   </td>
                <td>${resul}</td>
            </tr> 
        </table>`;



    }

    
</script>



</html>
